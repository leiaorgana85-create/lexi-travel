name: List loading regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  list-loading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check visible app version
        run: node scripts/check-version.cjs
      - name: Check backend authorization recovery
        run: |
          node --check backend-auth-recovery.js
          node tests/backend-auth-recovery.cjs
      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/list-test-deps" --no-save --package-lock=false happy-dom@21.0.4
      - name: Check stalled responses and offline sync
        run: |
          node tests/recovery-regressions.cjs
          node tests/list-timeouts.cjs
          node tests/offline.cjs
          node tests/sync-regressions.cjs
          node tests/calendar-delete-race.cjs
      - name: Check cold loads, reopen, resume, cache restoration
        env:
          HAPPY_DOM_MODULE: ${{ runner.temp }}/list-test-deps/node_modules/happy-dom/lib/index.js
        run: |
          node tests/list-latency.mjs
          node tests/performance.mjs
          node tests/dom-smoke.mjs
